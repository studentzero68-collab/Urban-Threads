<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Check-It & Fit-It</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav">
        <a href="index.html" class="nav-logo">Check-It & Fit-It</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-tabs" role="group" aria-label="Choose login or signup">
                <button type="button" class="auth-tab active" data-tab="login">Log In</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <form id="login-form" class="auth-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required autocomplete="email">

                <label for="login-password">Password</label>
                <input type="password" id="login-password" required autocomplete="current-password">

                <p class="auth-error" id="login-error"></p>

                <button type="submit" class="btn auth-submit">Log In</button>
            </form>

            <form id="signup-form" class="auth-form hidden">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" required autocomplete="email">

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required autocomplete="new-password" minlength="6">

                <p class="auth-error" id="signup-error"></p>

                <button type="submit" class="btn auth-submit">Sign Up</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Check-It & Fit-It</p>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
